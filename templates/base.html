<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}競馬AI予想{% endblock %}</title>
  <!-- ?v= を上げないとスマホのブラウザが古いCSSを使い続ける。
       CSSを触ったら必ず日付を更新すること（2026-08-14: highlight-note を追加） -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260816">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <span class="logo-icon">🏇</span>
        <span class="logo-text">競馬<span class="logo-ai">AI</span></span>
      </div>
      <nav class="header-nav">
        <a href="{{ url_for('races') }}" class="nav-link {% if request.endpoint == 'races' %}active{% endif %}">
          <span class="nav-icon">📋</span><span class="nav-label">レース一覧</span>
        </a>
        <a href="{{ url_for('results') }}" class="nav-link {% if request.endpoint == 'results' %}active{% endif %}">
          <span class="nav-icon">📊</span><span class="nav-label">成績</span>
        </a>
        <a href="{{ url_for('stats') }}" class="nav-link {% if request.endpoint == 'stats' %}active{% endif %}">
          <span class="nav-icon">📈</span><span class="nav-label">集計</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>競馬AI予想 — 参考情報のみ。馬券購入は自己責任でお願いします。</p>
    <p><a href="{{ url_for('api_refresh') }}" class="refresh-link">🔄 データ更新</a></p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
